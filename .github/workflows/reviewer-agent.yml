name: Automated PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # On-demand trigger. Without this the reviewer could only ever run as a side
  # effect of opening a PR, which is part of why a retired model went unnoticed
  # for six weeks (BEA-428): there was no way to ask "does the reviewer still
  # work?" short of raising a pull request. A PR number is required because the
  # script reads the diff and posts its review there.
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Verify shared parsing self-check
        # A self-check nothing runs is the same false assurance this pipeline
        # exists to remove. It caught nothing when extract_json_value was
        # renamed out from under it and the block sat broken for three commits.
        # Two seconds here, and a broken parser contract fails before any model
        # is called.
        run: python .agents/scripts/_shared.py

      - name: Run PR Reviewer Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── LLM provider chain ──────────────────────────────────────
          # No model is pinned as the primary. openrouter/auto is a ROUTER: it
          # picks a live model per request, so it has no version that can be
          # retired out from under this workflow (BEA-428, where a pinned
          # qwen3 model 410'd every review for a month).
          #
          # A router still fails — most often on an exhausted credit balance,
          # which returns 402, not 410. Fallback 1 is a separate account and
          # endpoint so a funding or key problem at one provider does not stop
          # reviews. Tiers are tried in order; a tier with any of URL / key /
          # model missing is skipped and announced in the log.
          #
          # These are settings, not code. Changing a model or endpoint here
          # needs no source edit.
          LLM_URL: "https://openrouter.ai/api/v1"
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_MODEL: "openrouter/auto"
          LLM_URL_FALLBACK1: "https://ollama.com/v1"
          LLM_API_KEY_FALLBACK1: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          REVIEW_MODEL_FALLBACK1: "glm-5.2:cloud"
          # Attempts per tier, for response-quality failures only. A model that
          # mis-escapes a character deep in a long prose field produces
          # unparseable JSON and loses the whole review; the same prompt
          # usually parses on a second call. Deterministic failures (credits,
          # auth, retired model) are never retried.
          LLM_ATTEMPTS_PER_TIER: "2"
          # Escalation is OFF by default and deliberately so: naming a specific
          # stronger model reintroduces exactly the retirement risk the router
          # removes. Set it to pin one, accepting that it must be re-verified
          # whenever that model is deprecated. Empty = the router keeps routing.
          ESCALATE_MODEL: ""
          ESCALATE_AFTER_CYCLES: "5"
          # Hard cap: halt the loop entirely after this many completed cycles.
          # Was 3, which truncated legitimate review — real PRs in the consuming
          # repos have needed 24, 23, 13 and 9 rounds. The cap is for a PR that
          # is genuinely not converging, not a review budget.
          MAX_REVIEW_CYCLES: "25"
          # Past this many cycles the reviewer is instructed to enumerate the
          # full state space rather than issue another narrow fix to a region
          # earlier rounds already touched.
          REPETITION_WARNING_AFTER_CYCLES: "2"
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: python .agents/scripts/review_pr.py
