# Open Code Review (Alibaba) — REUSABLE workflow, called from other repos.
#
# This is the shared, single-source-of-truth OCR PR-review workflow for all of
# Beau's repos. Each consuming repo carries only a thin caller stub (see
# templates/ocr-review-caller.yml in this repo) that declares the triggers and
# does `uses: Beau-s-Dev-Org/beau-dev-blueprint/.github/workflows/ocr-review.yml@<SHA>`,
# pinned to a commit SHA and stamped/refreshed via scripts/rollout-ocr.sh (never `@main`),
# passing model config as inputs and the LLM credentials as explicit secrets.
# All review logic, the pinned OCR action version, and the LLM fallback chain
# live HERE — edit once, every repo picks it up.
#
# This workflow only runs via workflow_call; it never triggers in this repo.
#
# Contract (everything is explicit — no `secrets: inherit`, so a consuming
# repo exposes only its OCR credentials to this workflow, and no reliance on
# cross-repo vars-context semantics):
#   inputs   llm_model (required), llm_model_fallback1/2,
#            llm_use_anthropic_fallback1/2 ('true' only for Anthropic's API)
#   secrets  OCR_LLM_URL + OCR_LLM_AUTH_TOKEN (required),
#            OCR_LLM_URL_FALLBACK1/2 + OCR_LLM_AUTH_TOKEN_FALLBACK1/2
#
# Fallback semantics: the OCR action has no native fallback, so the workflow
# retries the whole review against each configured backup when the previous
# attempt fails. A fallback counts as configured only when its URL secret,
# token secret, AND model input are all present — a partially-configured
# fallback is skipped rather than failing on auth with a confusing message.
# Leaving fallbacks unconfigured changes nothing.
#
# EVERY attempt sets upload_artifacts: 'false' — primary included (BEA-474).
#
# Inside the action the step order is: run review -> UPLOAD ARTIFACT ->
# fail-on-error -> POST COMMENTS. The upload therefore sits between a
# completed review and the posting of its findings, and those steps cannot be
# reordered from here. Any upload failure aborts the composite before "Post
# review comments" runs, so the review is computed, echoed to the job log, and
# then silently discarded.
#
# Two live incidents, both of that shape. The artifact is named
# ocr-review-result-<run_id>-<run_attempt>, and a fallback runs in the SAME job
# as the failed primary, so both compute the same name and the second upload
# 409s: marketing-as-code PR #302 during the 2026-08-20 primary-provider
# outage, and beauzone/mac-engine#24 on 2026-08-28, where a completed review
# that had found a real bug never reached the PR and was recovered only by
# reading the raw job log. Disabling the fallback upload fixed the collision
# but left the class open on the primary path, where a quota or a transient
# 5xx does the same thing.
#
# The result JSON is still printed to the job log by the action's own
# "=== OCR result ===" step. What is given up is a duplicate download; what is
# bought is that a storage fault can no longer discard a review.
#
# The OCR action is pinned to a commit SHA (not @main) since it runs with
# pull-requests: write and handles LLM/GitHub credentials.

name: OpenCodeReview PR Review (reusable)

on:
  workflow_call:
    inputs:
      llm_model:
        description: Model name at the primary endpoint (e.g. openrouter/auto)
        required: true
        type: string
      llm_model_fallback1:
        description: Model name at the first fallback endpoint
        required: false
        type: string
        default: ''
      llm_use_anthropic_fallback1:
        description: "'true' only if fallback 1 is Anthropic's API"
        required: false
        type: string
        default: 'false'
      llm_model_fallback2:
        description: Model name at the second fallback endpoint
        required: false
        type: string
        default: ''
      llm_use_anthropic_fallback2:
        description: "'true' only if fallback 2 is Anthropic's API"
        required: false
        type: string
        default: 'false'
    secrets:
      OCR_LLM_URL:
        description: Primary OpenAI-compatible endpoint URL
        required: true
      OCR_LLM_AUTH_TOKEN:
        description: API key for the primary endpoint
        required: true
      OCR_LLM_URL_FALLBACK1:
        required: false
      OCR_LLM_AUTH_TOKEN_FALLBACK1:
        required: false
      OCR_LLM_URL_FALLBACK2:
        required: false
      OCR_LLM_AUTH_TOKEN_FALLBACK2:
        required: false

jobs:
  code-review:
    runs-on: ubuntu-latest
    # Each review attempt has its own 20-minute step timeout, so a hung LLM
    # endpoint cannot consume the whole job budget; 65 covers three sequential
    # attempts (3 × 20) plus overhead, guaranteeing the final fail-gate step
    # still runs instead of being cancelled by the job timeout.
    timeout-minutes: 65
    # Declared here rather than inherited. A reusable workflow with no
    # permissions block takes the caller's, so what this job can do depended on
    # every consuming repo's stub and on repository defaults — under a
    # restrictive default the incomplete-review comment below would silently
    # degrade to a ::warning::, which is the failure mode this whole file is
    # about. pull-requests: write is what `gh pr comment` needs; nothing here
    # writes contents or touches issues.
    permissions:
      contents: read
      pull-requests: write
    # The secrets context is NOT available in step-level `if:` conditions
    # (only github/needs/strategy/matrix/job/runner/env/vars/steps/inputs are),
    # so "is this fallback configured?" is computed here in job env — where
    # secrets ARE available — and the fallback steps gate on the boolean.
    env:
      OCR_FALLBACK1_CONFIGURED: ${{ secrets.OCR_LLM_URL_FALLBACK1 != '' && secrets.OCR_LLM_AUTH_TOKEN_FALLBACK1 != '' && inputs.llm_model_fallback1 != '' }}
      OCR_FALLBACK2_CONFIGURED: ${{ secrets.OCR_LLM_URL_FALLBACK2 != '' && secrets.OCR_LLM_AUTH_TOKEN_FALLBACK2 != '' && inputs.llm_model_fallback2 != '' }}
    # Conditional concurrency group (job-level, since a reusable workflow
    # cannot set workflow-level concurrency for its caller).
    #
    # Matching events (PR events + /open-code-review comments from
    # MEMBER/OWNER/COLLABORATOR humans) share a per-PR group so a new review
    # cancels any stale one for the same PR. Non-matching comments land in a
    # unique noop-<run_id> group that can never collide with a real review, so
    # they are skipped instantly without cancelling anything. (The github
    # context inside a called workflow is the CALLER's event, so these
    # expressions see the real PR/comment payload.)
    concurrency:
      group: >-
        ${{
          (
            github.event_name == 'pull_request_target'
            || (
              github.event_name == 'issue_comment'
              && github.event.issue.pull_request
              && github.event.comment.user.type != 'Bot'
              && (
                github.event.comment.author_association == 'MEMBER'
                || github.event.comment.author_association == 'OWNER'
                || github.event.comment.author_association == 'COLLABORATOR'
              )
              && (
                startsWith(github.event.comment.body, '/open-code-review')
                || startsWith(github.event.comment.body, '@open-code-review')
              )
            )
          )
          && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
          || format('noop-{0}', github.run_id)
        }}
      cancel-in-progress: true
    # Run on PR events, or on human-authored comments starting with trigger
    # keywords. Bot comments are excluded as a safety net: GITHUB_TOKEN already
    # suppresses events from bot-posted comments, but a PAT/App token would not.
    # issue_comment triggers are further gated on author_association so only
    # MEMBER/OWNER/COLLABORATOR users can spend LLM quota via re-review.
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            // For issue_comment events, resolve PR base/head so the action
            // can review the right diff (issue_comment has no top-level
            // pull_request payload fields).
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Run OpenCodeReview (primary)
        id: ocr-primary
        # v1.8.6 — pinned to the release commit SHA, not @main.
        # continue-on-error so a primary LLM failure falls through to the
        # fallback attempts below instead of failing the job outright; the
        # final "Fail if all review attempts failed" step restores the red X
        # when no attempt succeeds.
        timeout-minutes: 20
        continue-on-error: true
        uses: alibaba/open-code-review@a17e884c2bb2f460f694cf757deb2bf3d93dcd82 # v1.8.6
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ inputs.llm_model }}
          llm_use_anthropic: 'false'
          ocr_version: '1.8.6'
          # The primary gives up its artifact too. Inside the action the step
          # order is: run review -> UPLOAD ARTIFACT -> fail-on-error -> POST
          # COMMENTS. The upload therefore sits between a completed review and
          # the posting of its findings, and the action's steps cannot be
          # reordered from here. Any upload failure — the run_id/run_attempt
          # name colliding, a storage quota, a transient 5xx — aborts the
          # composite before "Post review comments" runs, so the review is
          # computed, printed to the job log, and then silently thrown away.
          # That is not hypothetical: it happened on beauzone/mac-engine#24,
          # where a completed review that had found a real bug never reached
          # the PR and was only recovered by reading the raw job log (BEA-473,
          # BEA-474). The result JSON is still echoed to the log by the action's
          # own "=== OCR result ===" step, so what is given up is a duplicate
          # download; what is bought is that a storage fault can no longer
          # discard a review.
          upload_artifacts: 'false'
          # For issue_comment triggers, pass the resolved refs; for
          # pull_request_target the action resolves them from the event.
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      - name: Run OpenCodeReview (fallback 1)
        id: ocr-fallback1
        # Runs only when the primary attempt failed AND a first fallback
        # backend is fully configured (URL + token + model). Same pinned SHA
        # and inputs as the primary; only the LLM backend differs.
        # NOTE: in the rare case the primary's LLM call succeeded but posting
        # comments failed partway, a fallback re-review may post duplicates —
        # the action's sticky summary updates in place, but inline comments
        # can repeat. Accepted: a duplicated review beats a silently missing
        # one, and history is never deleted.
        if: >-
          steps.ocr-primary.outcome == 'failure'
          && env.OCR_FALLBACK1_CONFIGURED == 'true'
        timeout-minutes: 20
        continue-on-error: true
        uses: alibaba/open-code-review@a17e884c2bb2f460f694cf757deb2bf3d93dcd82 # v1.8.6
        with:
          llm_url: ${{ secrets.OCR_LLM_URL_FALLBACK1 }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN_FALLBACK1 }}
          llm_model: ${{ inputs.llm_model_fallback1 }}
          llm_use_anthropic: ${{ inputs.llm_use_anthropic_fallback1 || 'false' }}
          ocr_version: '1.8.6'
          # See the fallback-semantics note in the header: the primary
          # attempt already uploaded ocr-review-result-<run_id>-<attempt>,
          # and a second upload under the same name 409s and fails the
          # composite after a COMPLETED review.
          upload_artifacts: 'false'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      - name: Run OpenCodeReview (fallback 2)
        id: ocr-fallback2
        # Runs only when the primary failed, fallback 1 did not succeed
        # (failed, or was skipped because it isn't configured), and a second
        # fallback backend is fully configured.
        if: >-
          steps.ocr-primary.outcome == 'failure'
          && steps.ocr-fallback1.outcome != 'success'
          && env.OCR_FALLBACK2_CONFIGURED == 'true'
        timeout-minutes: 20
        continue-on-error: true
        uses: alibaba/open-code-review@a17e884c2bb2f460f694cf757deb2bf3d93dcd82 # v1.8.6
        with:
          llm_url: ${{ secrets.OCR_LLM_URL_FALLBACK2 }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN_FALLBACK2 }}
          llm_model: ${{ inputs.llm_model_fallback2 }}
          llm_use_anthropic: ${{ inputs.llm_use_anthropic_fallback2 || 'false' }}
          ocr_version: '1.8.6'
          # Same artifact-name conflict as fallback 1.
          upload_artifacts: 'false'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      - name: Fail if the review only partially ran
        # OCR exits 0 when it reviewed SOME of the files it selected. Its own
        # result then reads:
        #
        #   "status": "partial",
        #   "message": "Review partially complete: 0 finding(s); 2 of 5 selected item(s) failed.",
        #   "manifest": { "terminal_state": "partial",
        #                 "coverage": { "failed": [ { "path": ..., "classification": "timeout" } ] } }
        #
        # ...and every surface above it stays green: this check, `gh pr checks`,
        # the PR's merge state. "0 findings" then means "we did not look",
        # which is indistinguishable from "we looked and found nothing" unless
        # someone opens this log and reads the JSON.
        #
        # Not hypothetical. On marketing-as-code#348 (2026-09-18, run
        # 35397919573) the two files carrying all the logic under review both
        # exceeded the per-file time limit and were never read; the three that
        # completed were a test module, a settings JSON and one script. The
        # check went green and the PR was a click from merging on a review that
        # had not happened. Note summary.files_reviewed said 5 — it counts
        # SELECTED items, not reviewed ones, so it cannot be used here.
        #
        # Every consuming repo's merge policy says a review that never ran is
        # not approval. This step is what makes that enforceable from the PR
        # page instead of from a log.
        #
        # Runs whenever an attempt SUCCEEDED — the all-failed case belongs to
        # the next step, where /tmp/ocr-result.json is absent or stale.
        if: >-
          steps.ocr-primary.outcome == 'success'
          || steps.ocr-fallback1.outcome == 'success'
          || steps.ocr-fallback2.outcome == 'success'
        shell: bash
        env:
          # BEA-327: never interpolate a context value into a run body.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Overridable so the test harness can run hermetically; unchanged in
          # Actions, where nothing sets it.
          RESULT="${OCR_RESULT_FILE:-/tmp/ocr-result.json}"
          # Actions always sets this; the default exists so that if it ever is
          # not set, `set -u` does not abort the incomplete path halfway and
          # take the PR comment down with it. Found by enumerating the gate's
          # states rather than by a review.
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"

          # The two signals below are schema-independent facts: OCR saying
          # "partial" means partial whatever shape the rest of the document is
          # in. They are read FIRST, because an earlier version checked the
          # schema and the coverage shape before them — so a result reading
          # {"status":"partial", ..., "coverage":{}} hit the malformed-shape
          # warning and exited GREEN while literally declaring itself
          # incomplete. Verified before fixing.
          STATUS=""
          TERMINAL=""
          if [ -s "$RESULT" ] && jq -e . "$RESULT" >/dev/null 2>&1; then
            # @json-escaped: these are interpolated into ::error:: annotations
            # and into the PR comment, and a newline in either would split one
            # line into several. The forged-workflow-command half of that is
            # blocked by every line carrying its own prefix, but the format
            # damage and the misleading extra annotations are real.
            STATUS=$(jq -r '.status // "" | @json | .[1:-1]' "$RESULT")
            TERMINAL=$(jq -r '.manifest.terminal_state // "" | @json | .[1:-1]' "$RESULT")
          fi
          DECLARED_PARTIAL=no
          [ "$STATUS" = "partial" ] && DECLARED_PARTIAL=yes
          [ "$TERMINAL" = "partial" ] && DECLARED_PARTIAL=yes

          # Every "we cannot tell" path goes through here. Unknown is not the
          # same as verified, so it is reported loudly — but it does not fail
          # the job, because a shape change upstream would otherwise redden
          # every PR in every consuming repo at once and the first fix anyone
          # reached for would be deleting this step. UNLESS the run already
          # said it was partial, in which case there is nothing to be unsure
          # about.
          # The sticky comment is written only on the incomplete path, so a later
          # run that PASSES used to exit without touching it — leaving the PR
          # showing "did not finish" over a review that had since covered
          # everything. Both success paths clear it now. Lookup failures are
          # non-fatal: reporting must never be able to fail a valid review.
          GATE_MARKER='<!-- ocr-completeness-gate -->'

          find_gate_comment() {
            [ -n "${PR_NUMBER:-}" ] || return 0
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
              --jq "map(select(.body | contains(\"$GATE_MARKER\"))) | last | .id // empty" \
              2>/dev/null || true
          }

          clear_gate_comment() {  # $1 = one-line reason this run was fine
            local prev
            prev=$(find_gate_comment)
            [ -n "$prev" ] || return 0
            {
              echo "$GATE_MARKER"
              echo "## ✅ OpenCodeReview completeness"
              echo
              echo "A later run $1, so the incomplete-review notice above no longer"
              echo "describes this pull request."
              echo
              echo "<sub>[Run log](${RUN_URL})</sub>"
            } > "${OCR_COMMENT_FILE:-/tmp/ocr-incomplete.md}"
            gh api "repos/${REPO}/issues/comments/${prev}" --method PATCH \
              --field body=@"${OCR_COMMENT_FILE:-/tmp/ocr-incomplete.md}" >/dev/null 2>&1 \
              || echo "::warning::could not clear the stale incomplete-review comment on PR #${PR_NUMBER}"
          }

          abstain() {
            if [ "$DECLARED_PARTIAL" = "yes" ]; then
              echo "::error::OCR declared itself partial (status: ${STATUS:-?}, terminal_state: ${TERMINAL:-?}) and $1. A partial review is not an approval." >&2
              {
                echo "## ❌ OpenCodeReview did not finish"
                echo
                echo "The run reported itself **partial** (status: \`${STATUS:-?}\`, terminal_state: \`${TERMINAL:-?}\`)"
                echo "and $1, so which files went unreviewed could not be determined."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::warning::OCR completeness could not be verified: $1. Treat this check as 'unknown', not 'passed'."
            echo "⚠️ OCR completeness could not be verified ($1)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          [ -s "$RESULT" ] || abstain "the result file is missing or empty"
          jq -e . "$RESULT" >/dev/null 2>&1 || abstain "the result is not valid JSON"

          SCHEMA=$(jq -r '.manifest.schema_version // "absent"' "$RESULT")
          [ "$SCHEMA" = "ocr.run-manifest/v1" ] \
            || abstain "it declares schema_version ${SCHEMA} and this step understands ocr.run-manifest/v1 only"

          # ONE definition of an entry's identity, used by every comparison
          # below. Tagged with the field it came from: item_id and path are
          # different namespaces, so untagged strings let one entry's path
          # alias another's item_id and the two collapsed into one.
          #
          # `.item_id // .path` was wrong twice over: jq's // falls back only on
          # null/false, so an empty item_id BEAT a usable path, and a type check
          # passed it because "" is a string.
          ID='(if (.item_id? | type == "string" and length > 0) then "item_id:" + .item_id
               elif (.path? | type == "string" and length > 0) then "path:" + .path
               else null end)'

          jq -e '.manifest.coverage
                 | (.selected | type == "array")
                   and (.completed | type == "array")
                   and (.failed | type == "array")
                   and ([.selected[], .completed[], (.reused // [])[],
                         (.waived // [])[], .failed[]]
                        | all(type == "object" and ('"$ID"' != null)))' \
             "$RESULT" >/dev/null 2>&1 \
            || abstain "its coverage arrays are missing or hold entries without a usable item_id/path"

          # THE WHOLE COMPARISON HAPPENS INSIDE jq. It used to run through
          # `sort`/`comm` on newline-delimited files, and git permits a newline
          # in a filename — so one path could split into two lines and merge
          # with other identities. jq compares the values themselves, so what a
          # path contains stops being a question. The counts come back as two
          # integers and the report as one line per entry, with the path
          # @json-escaped so an exotic name cannot break the formatting either.
          COUNTS=$(jq -r '
            .manifest.coverage as $c
            | ([$c.selected[] | '"$ID"'] | unique) as $sel
            | ([($c.completed + ($c.reused // []) + ($c.waived // []))[] | '"$ID"'] | unique) as $cov
            | [($sel | length), ($sel - ($sel - $cov) | length)]
            | @tsv' "$RESULT") || abstain "its coverage entries could not be read"
          N_SELECTED=$(printf '%s' "$COUNTS" | cut -f1)
          N_COVERED=$(printf '%s' "$COUNTS" | cut -f2)

          INCOMPLETE="$DECLARED_PARTIAL"
          [ "$(jq '.manifest.coverage.failed | length' "$RESULT")" -gt 0 ] && INCOMPLETE=yes
          [ "${N_COVERED:-0}" -ne "${N_SELECTED:-0}" ] && INCOMPLETE=yes

          # Only once the signals are clean: nothing selected means there was
          # genuinely nothing to review — a Markdown-only diff, say. That is a
          # true "nothing to approve", not silence.
          if [ "$INCOMPLETE" = "no" ] && [ "${N_SELECTED:-0}" -eq 0 ]; then
            echo "OCR selected no files for review (status: ${STATUS:-?}); there is nothing for this gate to withhold."
            echo "ℹ️ OCR selected no files for review — nothing to approve or withhold." >> "$GITHUB_STEP_SUMMARY"
            clear_gate_comment "selected no files to review"
            exit 0
          fi

          if [ "$INCOMPLETE" = "no" ]; then
            echo "OCR reviewed every item it selected (${N_COVERED} of ${N_SELECTED})."
            clear_gate_comment "reviewed every item it selected (${N_COVERED} of ${N_SELECTED})"
            exit 0
          fi

          # Failed entries carry a reason; an unaccounted one exists in no
          # bucket at all and has none to give.
          UNREVIEWED=$(jq -r '
            .manifest.coverage as $c
            | ([($c.completed + ($c.reused // []) + ($c.waived // []))[] | '"$ID"'] | unique) as $cov
            | ([$c.failed[] | '"$ID"'] | unique) as $failed
            | ( [ $c.failed[]
                  | "- \(.path // "?" | @json | .[1:-1] as $p | if ($p | test("`")) then ($p | gsub("`"; "\u0026#96;") | gsub("<"; "\u0026lt;")) else "`" + $p + "`" end) — \(.classification // "unknown" | @json | .[1:-1])"
                    + (if .reason then ": " + (.reason | @json | .[1:-1]) else "" end) ]
              + [ $c.selected[]
                  | select(('"$ID"' | IN($cov[]) | not) and ('"$ID"' | IN($failed[]) | not))
                  | "- \(.path // "?" | @json | .[1:-1] as $p | if ($p | test("`")) then ($p | gsub("`"; "\u0026#96;") | gsub("<"; "\u0026lt;")) else "`" + $p + "`" end) — not reported in any coverage bucket" ] )
            | .[]' "$RESULT" || true)
          [ -n "$UNREVIEWED" ] || UNREVIEWED="- (the run reported itself incomplete without naming which items were missed)"

          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::OCR did not review ${line#- }"
          done <<< "$UNREVIEWED"

          {
            echo "## ❌ OpenCodeReview did not finish"
            echo
            echo "Covered **${N_COVERED} of ${N_SELECTED}** selected files (status: ${STATUS:-?}, terminal_state: ${TERMINAL:-?})."
            echo "The files below were never read, so no finding count from this run applies to them."
            echo
            echo "$UNREVIEWED"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${PR_NUMBER:-}" ]; then
            {
              echo "<!-- ocr-completeness-gate -->"
              echo "## ❌ OpenCodeReview did not finish"
              echo
              echo "This review covered **${N_COVERED} of ${N_SELECTED}** selected files. The following were"
              echo "selected and never reviewed, so **no finding count from this run applies to them**:"
              echo
              echo "$UNREVIEWED"
              echo
              echo "A review that did not run is not an approval. Re-run it by commenting"
              echo "\`/open-code-review\`, or reduce the size of the files above — \`timeout\`"
              echo "means the file exceeded the per-file limit and will keep doing so."
              echo
              echo "<sub>[Run log](${RUN_URL})</sub>"
            } > "${OCR_COMMENT_FILE:-/tmp/ocr-incomplete.md}"
            # Update in place. The comment tells the reader to re-run, so without
            # a marker every retry stacked another "did not finish" comment on
            # the PR — the same sticky pattern the OCR action uses for its own
            # summary.
            PREV=$(find_gate_comment)
            if [ -n "$PREV" ]; then
              gh api "repos/${REPO}/issues/comments/${PREV}" --method PATCH \
                --field body=@"${OCR_COMMENT_FILE:-/tmp/ocr-incomplete.md}" >/dev/null \
                || echo "::warning::could not update the incomplete-review comment on PR #${PR_NUMBER}"
            else
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "${OCR_COMMENT_FILE:-/tmp/ocr-incomplete.md}" \
                || echo "::warning::could not post the incomplete-review comment to PR #${PR_NUMBER}"
            fi
          fi

          echo "::error::OCR covered ${N_COVERED} of ${N_SELECTED} selected files (status: ${STATUS:-?}, terminal_state: ${TERMINAL:-?}). A partial review is not an approval — see the job summary for the files it skipped."
          exit 1

      - name: Fail if all review attempts failed
        # The attempt steps are continue-on-error, so this step is the only
        # thing that turns the job red. A skipped fallback (not configured)
        # has outcome 'skipped', which correctly does not count as success.
        if: >-
          steps.ocr-primary.outcome != 'success'
          && steps.ocr-fallback1.outcome != 'success'
          && steps.ocr-fallback2.outcome != 'success'
        env:
          PRIMARY_OUTCOME: ${{ steps.ocr-primary.outcome }}
          FALLBACK1_OUTCOME: ${{ steps.ocr-fallback1.outcome }}
          FALLBACK2_OUTCOME: ${{ steps.ocr-fallback2.outcome }}
        shell: bash
        run: |
          # Deliberately does NOT claim the LLM backends failed. A step's
          # `outcome` is failure if ANYTHING in that composite action failed —
          # the LLM call, dependency install, checkout, comment posting — so
          # naming the LLM here sends whoever debugs it to the wrong system.
          # It did exactly that during the BEA-473 artifact-409 incident, where
          # three LLM calls succeeded and this message still read "all backends
          # failed". State what is known and point at where the cause is.
          echo "::error::No OCR review attempt succeeded (primary: ${PRIMARY_OUTCOME}, fallback1: ${FALLBACK1_OUTCOME}, fallback2: ${FALLBACK2_OUTCOME}). This reports the *step* outcomes, which cover every stage of the review action, not the LLM call alone — open the failing attempt's log and read its last error before assuming a backend outage."
          exit 1
