# Open Code Review (Alibaba) — REUSABLE workflow, called from other repos.
#
# This is the shared, single-source-of-truth OCR PR-review workflow for all of
# Beau's repos. Each consuming repo carries only a thin caller stub (see
# templates/ocr-review-caller.yml in this repo) that declares the triggers and
# does `uses: Beau-s-Dev-Org/beau-dev-blueprint/.github/workflows/ocr-review.yml@<SHA>`,
# pinned to a commit SHA and stamped/refreshed via scripts/rollout-ocr.sh (never `@main`),
# passing model config as inputs and the LLM credentials as explicit secrets.
# All review logic, the pinned OCR action version, and the LLM fallback chain
# live HERE — edit once, every repo picks it up.
#
# This workflow only runs via workflow_call; it never triggers in this repo.
#
# Contract (everything is explicit — no `secrets: inherit`, so a consuming
# repo exposes only its OCR credentials to this workflow, and no reliance on
# cross-repo vars-context semantics):
#   inputs   llm_model (required), llm_model_fallback1/2,
#            llm_use_anthropic_fallback1/2 ('true' only for Anthropic's API)
#   secrets  OCR_LLM_URL + OCR_LLM_AUTH_TOKEN (required),
#            OCR_LLM_URL_FALLBACK1/2 + OCR_LLM_AUTH_TOKEN_FALLBACK1/2
#
# Fallback semantics: the OCR action has no native fallback, so the workflow
# retries the whole review against each configured backup when the previous
# attempt fails. A fallback counts as configured only when its URL secret,
# token secret, AND model input are all present — a partially-configured
# fallback is skipped rather than failing on auth with a confusing message.
# Leaving fallbacks unconfigured changes nothing.
#
# EVERY attempt sets upload_artifacts: 'false' — primary included (BEA-474).
#
# Inside the action the step order is: run review -> UPLOAD ARTIFACT ->
# fail-on-error -> POST COMMENTS. The upload therefore sits between a
# completed review and the posting of its findings, and those steps cannot be
# reordered from here. Any upload failure aborts the composite before "Post
# review comments" runs, so the review is computed, echoed to the job log, and
# then silently discarded.
#
# Two live incidents, both of that shape. The artifact is named
# ocr-review-result-<run_id>-<run_attempt>, and a fallback runs in the SAME job
# as the failed primary, so both compute the same name and the second upload
# 409s: marketing-as-code PR #302 during the 2026-08-20 primary-provider
# outage, and beauzone/mac-engine#24 on 2026-08-28, where a completed review
# that had found a real bug never reached the PR and was recovered only by
# reading the raw job log. Disabling the fallback upload fixed the collision
# but left the class open on the primary path, where a quota or a transient
# 5xx does the same thing.
#
# The result JSON is still printed to the job log by the action's own
# "=== OCR result ===" step. What is given up is a duplicate download; what is
# bought is that a storage fault can no longer discard a review.
#
# The OCR action is pinned to a commit SHA (not @main) since it runs with
# pull-requests: write and handles LLM/GitHub credentials.

name: OpenCodeReview PR Review (reusable)

on:
  workflow_call:
    inputs:
      llm_model:
        description: Model name at the primary endpoint (e.g. openrouter/auto)
        required: true
        type: string
      llm_timeout_sec:
        description: >-
          Per-LLM-request timeout in seconds, passed to every review attempt.
          The action's own default is 300, which classifies any file the model
          cannot finish in that window as `timeout` — a PARTIAL review, which
          the completeness gate below correctly refuses to call an approval.
          Two consecutive PRs in beauzone/marketing-as-code hit this on
          ordinary source files (a ~900-line test module), so 300 is too tight
          for this fleet's real files rather than only for pathological ones.
          Must not exceed `review_task_timeout_min` × 60: a single request
          cannot usefully outlast the per-file task deadline that contains it.
          The "Check review time limits" step enforces this. On a PR of more
          than 8 files the per-file deadline is shortened to fit the attempt,
          and this value is clamped to that shorter deadline, so the 1200 here
          is the budget only for PRs small enough to keep it (up to 8 files at
          the default deadline: 4-8 files get 16 minutes, 960s).

          Raised 600 -> 1200 (2026-10-03): marketing-as-code PR #363 still hit
          `timeout` at 600s on ~200-line Python modules, across several runs.
          1200s stayed well inside the step timeout then in force (30 minutes).

          2026-10-27: neither raise could have helped. OCR v1.8.6 also applied
          a fixed 10-minute per-FILE task deadline (`ocr review --timeout`)
          that the action could not set, and that is what fired on
          marketing-as-code #363 and beau-dev-blueprint #73 (a whole run took
          ~13 minutes and still reported `timeout`). The action is now v1.13.3,
          which exposes that deadline as `review_task_timeout`; see
          `review_task_timeout_min` below. This stays at 1200.
        required: false
        type: string
        default: '1200'
      review_task_timeout_min:
        description: >-
          Per-file task deadline in minutes (OCR's `ocr review --timeout`,
          passed as the action's `review_task_timeout`). It covers every LLM
          call, tool call and retry for one file, so it is the limit that
          decides `timeout` in the completeness report. OCR's default is 15.

          25 (2026-10-27): files in beau-dev-blueprint #73 hit the old fixed
          10. The deadline applies per review round, and effort is pinned to
          medium (2 rounds), so 25 × 2 plus install and posting fits the
          60-minute attempt for a PR of up to 3 files. Allowed range 1-25.
          For larger PRs "Check review time limits" passes a shorter deadline,
          50 / (waves × rounds + 1 for OCR's grouping request from 4 files),
          so the attempt still ends in a readable partial review instead of a
          killed step.
        required: false
        type: string
        default: '25'
      copilot_fallback:
        description: >-
          When no review attempt produces a complete review, request a GitHub
          Copilot code review on the PR as a BACKUP signal. Advisory only: it
          never turns this check green and is not an approval. Set to 'false'
          in a repo without Copilot code review.
        required: false
        type: string
        default: 'true'
      llm_model_fallback1:
        description: Model name at the first fallback endpoint
        required: false
        type: string
        default: ''
      llm_use_anthropic_fallback1:
        description: "'true' only if fallback 1 is Anthropic's API"
        required: false
        type: string
        default: 'false'
      llm_model_fallback2:
        description: Model name at the second fallback endpoint
        required: false
        type: string
        default: ''
      llm_use_anthropic_fallback2:
        description: "'true' only if fallback 2 is Anthropic's API"
        required: false
        type: string
        default: 'false'
    secrets:
      OCR_LLM_URL:
        description: Primary OpenAI-compatible endpoint URL
        required: true
      OCR_LLM_AUTH_TOKEN:
        description: API key for the primary endpoint
        required: true
      OCR_LLM_URL_FALLBACK1:
        required: false
      OCR_LLM_AUTH_TOKEN_FALLBACK1:
        required: false
      OCR_LLM_URL_FALLBACK2:
        required: false
      OCR_LLM_AUTH_TOKEN_FALLBACK2:
        required: false

jobs:
  code-review:
    runs-on: ubuntu-latest
    # Each review attempt has its own 60-minute step timeout, so a hung LLM
    # endpoint cannot consume the whole job budget; 210 covers three sequential
    # attempts (3 × 60) plus 30 minutes for PR context, the limits check, the
    # install cleanups, the completeness gate's API calls and the Copilot step,
    # each of which has its own timeout-minutes summing to 20, so the reserve
    # is enforced rather than assumed and the final fail-gate step still runs
    # instead of being cancelled by the job timeout.
    #
    # Nesting, enforced by "Check review time limits": the request timeout fits
    # in the per-file deadline, and every wave of per-file deadlines (derived
    # from the PR's file count) fits in the 60-minute step. If a limit can outlast the step that contains it, a
    # slow file stops producing a partial review — which the gate reports
    # precisely, naming the files it skipped — and starts producing a killed
    # step, which reports nothing useful and burns the attempt. Raising one
    # without the other trades a legible failure for an illegible one.
    timeout-minutes: 210
    # Declared here rather than inherited. A reusable workflow with no
    # permissions block takes the caller's, so what this job can do depended on
    # every consuming repo's stub and on repository defaults — under a
    # restrictive default the incomplete-review comment below would silently
    # degrade to a ::warning::, which is the failure mode this whole file is
    # about. pull-requests: write is what `gh pr comment` needs; nothing here
    # writes contents or touches issues.
    permissions:
      contents: read
      pull-requests: write
    # The secrets context is NOT available in step-level `if:` conditions
    # (only github/needs/strategy/matrix/job/runner/env/vars/steps/inputs are),
    # so "is this fallback configured?" is computed here in job env — where
    # secrets ARE available — and the fallback steps gate on the boolean.
    env:
      OCR_FALLBACK1_CONFIGURED: ${{ secrets.OCR_LLM_URL_FALLBACK1 != '' && secrets.OCR_LLM_AUTH_TOKEN_FALLBACK1 != '' && inputs.llm_model_fallback1 != '' }}
      OCR_FALLBACK2_CONFIGURED: ${{ secrets.OCR_LLM_URL_FALLBACK2 != '' && secrets.OCR_LLM_AUTH_TOKEN_FALLBACK2 != '' && inputs.llm_model_fallback2 != '' }}
    # Conditional concurrency group (job-level, since a reusable workflow
    # cannot set workflow-level concurrency for its caller).
    #
    # Matching events (PR events + /open-code-review comments from
    # MEMBER/OWNER/COLLABORATOR humans) share a per-PR group so a new review
    # cancels any stale one for the same PR. Non-matching comments land in a
    # unique noop-<run_id> group that can never collide with a real review, so
    # they are skipped instantly without cancelling anything. (The github
    # context inside a called workflow is the CALLER's event, so these
    # expressions see the real PR/comment payload.)
    concurrency:
      group: >-
        ${{
          (
            github.event_name == 'pull_request_target'
            || (
              github.event_name == 'issue_comment'
              && github.event.issue.pull_request
              && github.event.comment.user.type != 'Bot'
              && (
                github.event.comment.author_association == 'MEMBER'
                || github.event.comment.author_association == 'OWNER'
                || github.event.comment.author_association == 'COLLABORATOR'
              )
              && (
                startsWith(github.event.comment.body, '/open-code-review')
                || startsWith(github.event.comment.body, '@open-code-review')
              )
            )
          )
          && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
          || format('noop-{0}', github.run_id)
        }}
      cancel-in-progress: true
    # Run on PR events, or on human-authored comments starting with trigger
    # keywords. Bot comments are excluded as a safety net: GITHUB_TOKEN already
    # suppresses events from bot-posted comments, but a PAT/App token would not.
    # issue_comment triggers are further gated on author_association so only
    # MEMBER/OWNER/COLLABORATOR users can spend LLM quota via re-review.
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        timeout-minutes: 2   # bounded, so the job's 30-minute reserve holds
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            // For issue_comment events, resolve PR base/head so the action
            // can review the right diff (issue_comment has no top-level
            // pull_request payload fields).
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput('changed_files', String(pullRequest.changed_files));

      - name: Check review time limits
        id: limits
        timeout-minutes: 2   # bounded, so the job's 30-minute reserve holds
        # Validates the caller stub's limits, then derives the ones each attempt
        # actually uses, so that every attempt ends with a result the
        # completeness gate can read instead of a killed step that reports
        # nothing.
        #
        # OCR reviews 8 files at once, so a PR of N changed files runs in
        # ceil(N/8) waves. Each file may take up to the task deadline times its
        # review rounds (v1.13.3 internal/agent/agent.go:677), and the rounds
        # come from the effort level, pinned here to medium = 2 rounds
        # (internal/config/template/effort.go). The attempt step is a fixed 60
        # minutes, 10 of them reserved for install, checkout and comment
        # posting. From 4 files OCR first sends one grouping request
        # (GROUPING_MIN_FILES in its task template) BEFORE any per-file clock
        # starts; that request is bounded by the request timeout, which is
        # clamped to the deadline, so it costs at most one more deadline-sized
        # slot. The deadline passed is therefore
        #   min(review_task_timeout_min,
        #       floor(50 / (waves * rounds + (files >= 4 ? 1 : 0)))):
        # 1-3 files get the full 25 minutes per round, 4-8 get 16, 9-16 get 10,
        # and so on; a large PR gets a shorter deadline and a legible partial
        # review rather than a killed attempt. The request timeout is clamped
        # to fit inside the deadline. The changed-file count includes files OCR will
        # skip (deletions, Markdown), so it is an upper bound and errs toward
        # shorter deadlines, never longer; past 200 files the deadline sits at
        # a 1-minute floor with a warning rather than blocking the review. A
        # count that cannot be read is an error, not a guess: both supported
        # events always provide it.
        shell: bash
        env:
          # BEA-327: never interpolate a context value into a run body.
          LLM_TIMEOUT_SEC: ${{ inputs.llm_timeout_sec }}
          TASK_TIMEOUT_MIN: ${{ inputs.review_task_timeout_min }}
          # By event, not `a || b`: a genuine 0 is falsy in expressions and
          # would fall through to an output that is empty on this path.
          CHANGED_FILES: ${{ github.event_name == 'issue_comment' && steps.pr-context.outputs.changed_files || github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          # Errors are also written as an output, for "Report a limits error
          # on the PR". Newlines are stripped first: a value containing one
          # could otherwise add arbitrary outputs to GITHUB_OUTPUT.
          die() {
            local msg="${1//$'\n'/ }"; msg="${msg//$'\r'/ }"
            echo "::error::${msg}"
            echo "error=${msg}" >> "$GITHUB_OUTPUT"
            exit 1
          }
          for v in LLM_TIMEOUT_SEC TASK_TIMEOUT_MIN; do
            [[ "${!v}" =~ ^[1-9][0-9]{0,4}$ ]] || die "${v} must be a positive integer, got '${!v}'."
          done
          # Out-of-range settings are clamped by the derivation below (the
          # deadline never exceeds 25, the request never exceeds the deadline),
          # so they warn rather than fail: an older stub that raised them keeps
          # getting a review.
          if (( TASK_TIMEOUT_MIN > 25 )); then
            echo "::warning::review_task_timeout_min is ${TASK_TIMEOUT_MIN}; using at most 25 (one wave of 8 files at 2 review rounds must fit the 60-minute attempt step)."
          fi
          if (( LLM_TIMEOUT_SEC > TASK_TIMEOUT_MIN * 60 )); then
            echo "::warning::llm_timeout_sec is ${LLM_TIMEOUT_SEC}s, longer than the ${TASK_TIMEOUT_MIN}-minute per-file deadline that contains it; it is clamped to that deadline."
          fi
          [[ "${CHANGED_FILES:-}" =~ ^[0-9]{1,6}$ ]] \
            || die "Could not read the PR's changed-file count ('${CHANGED_FILES:-}'), so no per-file deadline can be guaranteed to fit the attempt."
          N=$(( 10#$CHANGED_FILES ))
          (( N >= 1 )) || N=1
          EFFORT=medium
          case "$EFFORT" in low) ROUNDS=1 ;; medium) ROUNDS=2 ;; high) ROUNDS=3 ;; esac
          WAVES=$(( (N + 7) / 8 ))
          GROUPING=0; (( N >= 4 )) && GROUPING=1   # one grouping request first
          TASK=$(( 50 / (WAVES * ROUNDS + GROUPING) ))
          (( TASK > TASK_TIMEOUT_MIN )) && TASK=$TASK_TIMEOUT_MIN
          if (( TASK < 1 )); then
            # The count includes files OCR never selects (deletions, Markdown,
            # lockfiles, generated trees), so the real load may be small. Run
            # at the 1-minute floor rather than block every review: if the
            # reviewable load really is this large, the attempt may still be
            # cut off, and the warning says why.
            echo "::warning::This PR changes ${N} files (${WAVES} waves of 8, ${ROUNDS} rounds each). Running at the 1-minute per-file floor; if most of those files are reviewable the attempt may not finish. Splitting the PR is the fix."
            TASK=1
          fi
          LLM=$LLM_TIMEOUT_SEC
          (( LLM > TASK * 60 )) && LLM=$(( TASK * 60 ))
          # Not floored at a minimum: OCR's grouping request runs before any
          # per-file clock and is bounded only by this value, so a request
          # longer than the deadline could overrun the attempt. Say plainly
          # that short requests make timeouts likely, instead.
          if (( LLM < 300 && LLM < LLM_TIMEOUT_SEC )); then
            echo "::warning::This PR's size cuts each LLM request to ${LLM}s (below OCR's own 300s default). Expect files to report timeout; splitting the PR is what gives them time."
          fi
          if (( TASK < TASK_TIMEOUT_MIN )); then
            echo "::notice::${N} changed files run in ${WAVES} waves of ${ROUNDS} rounds, so the per-file deadline is ${TASK} min per round (configured ${TASK_TIMEOUT_MIN}) to fit the 60-minute attempt."
          fi
          echo "task_minutes=${TASK}" >> "$GITHUB_OUTPUT"
          echo "llm_timeout_sec=${LLM}" >> "$GITHUB_OUTPUT"
          echo "effort=${EFFORT}" >> "$GITHUB_OUTPUT"
          # Which limits this run shortened, so the incomplete-review notice
          # only recommends raising a setting that would take effect.
          echo "task_shortened=$( (( TASK < TASK_TIMEOUT_MIN )) && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "llm_shortened=$( (( LLM < LLM_TIMEOUT_SEC )) && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "Review time limits: ${N} changed files, ${WAVES} wave(s) x ${ROUNDS} rounds; ${LLM}s per request, ${TASK} min per file per round, 60 min per attempt."

      - name: Run OpenCodeReview (primary)
        id: ocr-primary
        # v1.13.3 — pinned to the release commit SHA, not @main. Upgraded from
        # v1.8.6 (2026-10-27) for `review_task_timeout`; inputs used here are
        # unchanged, incremental review stays off by default (full PR each
        # run), and the result at /tmp/ocr-result.json keeps the
        # ocr.run-manifest/v1 schema the completeness gate reads. The action
        # still uploads its artifact before posting comments, so
        # upload_artifacts stays 'false' (see the header).
        # continue-on-error so a primary LLM failure falls through to the
        # fallback attempts below instead of failing the job outright; the
        # final "Fail if all review attempts failed" step restores the red X
        # when no attempt succeeds.
        timeout-minutes: 60
        continue-on-error: true
        uses: alibaba/open-code-review@375f64cd6f67a48a135da83cfcf59c52669a09cb # v1.13.3
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ inputs.llm_model }}
          llm_timeout: ${{ steps.limits.outputs.llm_timeout_sec }}
          llm_use_anthropic: 'false'
          ocr_version: '1.13.3'
          review_task_timeout: ${{ steps.limits.outputs.task_minutes }}
          # Pinned so the round count the limits step assumes is the one used.
          effort: ${{ steps.limits.outputs.effort }}
          # The primary gives up its artifact too. Inside the action the step
          # order is: run review -> UPLOAD ARTIFACT -> fail-on-error -> POST
          # COMMENTS. The upload therefore sits between a completed review and
          # the posting of its findings, and the action's steps cannot be
          # reordered from here. Any upload failure — the run_id/run_attempt
          # name colliding, a storage quota, a transient 5xx — aborts the
          # composite before "Post review comments" runs, so the review is
          # computed, printed to the job log, and then silently thrown away.
          # That is not hypothetical: it happened on beauzone/mac-engine#24,
          # where a completed review that had found a real bug never reached
          # the PR and was only recovered by reading the raw job log (BEA-473,
          # BEA-474). The result JSON is still echoed to the log by the action's
          # own "=== OCR result ===" step, so what is given up is a duplicate
          # download; what is bought is that a storage fault can no longer
          # discard a review.
          upload_artifacts: 'false'
          # For issue_comment triggers, pass the resolved refs; for
          # pull_request_target the action resolves them from the event.
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      - name: Clear the previous attempt's OCR install (before fallback 1)
        timeout-minutes: 2   # bounded, so the job's 30-minute reserve holds
        # The action runs `npm install -g` on every attempt. A second global
        # install of the same package on the same runner intermittently dies
        # with ENOTEMPTY when npm renames the existing directory aside, so the
        # fallback never reaches its LLM call (beauzone/mac-mcp-server run
        # 38345226012, 2026-10-13: primary failed, fallback 1 failed in
        # "Install OpenCodeReview" after 0.4s). Removing the first install —
        # and any half-renamed `.open-code-review-*` sibling — gives the
        # fallback a clean install.
        if: >-
          steps.ocr-primary.outcome == 'failure'
          && env.OCR_FALLBACK1_CONFIGURED == 'true'
        shell: bash
        run: |
          npm uninstall -g @alibaba-group/open-code-review >/dev/null 2>&1 || true
          ROOT="$(npm root -g)/@alibaba-group"
          rm -rf "$ROOT/open-code-review" "$ROOT"/.open-code-review-*
          rm -f "$(npm prefix -g)/bin/ocr"

      - name: Run OpenCodeReview (fallback 1)
        id: ocr-fallback1
        # Runs only when the primary attempt failed AND a first fallback
        # backend is fully configured (URL + token + model). Same pinned SHA
        # and inputs as the primary; only the LLM backend differs.
        # NOTE: in the rare case the primary's LLM call succeeded but posting
        # comments failed partway, a fallback re-review may post duplicates —
        # the action's sticky summary updates in place, but inline comments
        # can repeat. Accepted: a duplicated review beats a silently missing
        # one, and history is never deleted.
        if: >-
          steps.ocr-primary.outcome == 'failure'
          && env.OCR_FALLBACK1_CONFIGURED == 'true'
        timeout-minutes: 60
        continue-on-error: true
        uses: alibaba/open-code-review@375f64cd6f67a48a135da83cfcf59c52669a09cb # v1.13.3
        with:
          llm_url: ${{ secrets.OCR_LLM_URL_FALLBACK1 }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN_FALLBACK1 }}
          llm_model: ${{ inputs.llm_model_fallback1 }}
          llm_timeout: ${{ steps.limits.outputs.llm_timeout_sec }}
          llm_use_anthropic: ${{ inputs.llm_use_anthropic_fallback1 || 'false' }}
          ocr_version: '1.13.3'
          review_task_timeout: ${{ steps.limits.outputs.task_minutes }}
          # Pinned so the round count the limits step assumes is the one used.
          effort: ${{ steps.limits.outputs.effort }}
          # See the fallback-semantics note in the header: the primary
          # attempt already uploaded ocr-review-result-<run_id>-<attempt>,
          # and a second upload under the same name 409s and fails the
          # composite after a COMPLETED review.
          upload_artifacts: 'false'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      - name: Clear the previous attempt's OCR install (before fallback 2)
        timeout-minutes: 2   # bounded, so the job's 30-minute reserve holds
        # The action runs `npm install -g` on every attempt. A second global
        # install of the same package on the same runner intermittently dies
        # with ENOTEMPTY when npm renames the existing directory aside, so the
        # fallback never reaches its LLM call (beauzone/mac-mcp-server run
        # 38345226012, 2026-10-13: primary failed, fallback 1 failed in
        # "Install OpenCodeReview" after 0.4s). Removing the first install —
        # and any half-renamed `.open-code-review-*` sibling — gives the
        # fallback a clean install.
        if: >-
          steps.ocr-primary.outcome == 'failure'
          && steps.ocr-fallback1.outcome != 'success'
          && env.OCR_FALLBACK2_CONFIGURED == 'true'
        shell: bash
        run: |
          npm uninstall -g @alibaba-group/open-code-review >/dev/null 2>&1 || true
          ROOT="$(npm root -g)/@alibaba-group"
          rm -rf "$ROOT/open-code-review" "$ROOT"/.open-code-review-*
          rm -f "$(npm prefix -g)/bin/ocr"

      - name: Run OpenCodeReview (fallback 2)
        id: ocr-fallback2
        # Runs only when the primary failed, fallback 1 did not succeed
        # (failed, or was skipped because it isn't configured), and a second
        # fallback backend is fully configured.
        if: >-
          steps.ocr-primary.outcome == 'failure'
          && steps.ocr-fallback1.outcome != 'success'
          && env.OCR_FALLBACK2_CONFIGURED == 'true'
        timeout-minutes: 60
        continue-on-error: true
        uses: alibaba/open-code-review@375f64cd6f67a48a135da83cfcf59c52669a09cb # v1.13.3
        with:
          llm_url: ${{ secrets.OCR_LLM_URL_FALLBACK2 }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN_FALLBACK2 }}
          llm_model: ${{ inputs.llm_model_fallback2 }}
          llm_timeout: ${{ steps.limits.outputs.llm_timeout_sec }}
          llm_use_anthropic: ${{ inputs.llm_use_anthropic_fallback2 || 'false' }}
          ocr_version: '1.13.3'
          review_task_timeout: ${{ steps.limits.outputs.task_minutes }}
          # Pinned so the round count the limits step assumes is the one used.
          effort: ${{ steps.limits.outputs.effort }}
          # Same artifact-name conflict as fallback 1.
          upload_artifacts: 'false'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      - name: Fail if the review only partially ran
        id: completeness
        timeout-minutes: 5   # bounded, so the job's 30-minute reserve holds
        # OCR exits 0 when it reviewed SOME of the files it selected. Its own
        # result then reads:
        #
        #   "status": "partial",
        #   "message": "Review partially complete: 0 finding(s); 2 of 5 selected item(s) failed.",
        #   "manifest": { "terminal_state": "partial",
        #                 "coverage": { "failed": [ { "path": ..., "classification": "timeout" } ] } }
        #
        # ...and every surface above it stays green: this check, `gh pr checks`,
        # the PR's merge state. "0 findings" then means "we did not look",
        # which is indistinguishable from "we looked and found nothing" unless
        # someone opens this log and reads the JSON.
        #
        # Not hypothetical. On marketing-as-code#348 (2026-09-18, run
        # 35397919573) the two files carrying all the logic under review both
        # exceeded the per-file time limit and were never read; the three that
        # completed were a test module, a settings JSON and one script. The
        # check went green and the PR was a click from merging on a review that
        # had not happened. Note summary.files_reviewed said 5 — it counts
        # SELECTED items, not reviewed ones, so it cannot be used here.
        #
        # Every consuming repo's merge policy says a review that never ran is
        # not approval. This step is what makes that enforceable from the PR
        # page instead of from a log.
        #
        # Runs whenever an attempt SUCCEEDED — the all-failed case belongs to
        # the next step, where /tmp/ocr-result.json is absent or stale.
        if: >-
          steps.ocr-primary.outcome == 'success'
          || steps.ocr-fallback1.outcome == 'success'
          || steps.ocr-fallback2.outcome == 'success'
        shell: bash
        env:
          # BEA-327: never interpolate a context value into a run body.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The values actually used, so the notice below cannot drift from them.
          LLM_TIMEOUT_SEC: ${{ steps.limits.outputs.llm_timeout_sec }}
          TASK_TIMEOUT_MIN: ${{ steps.limits.outputs.task_minutes }}
          CONFIGURED_TASK_MIN: ${{ inputs.review_task_timeout_min }}
          TASK_SHORTENED: ${{ steps.limits.outputs.task_shortened }}
          LLM_SHORTENED: ${{ steps.limits.outputs.llm_shortened }}
        run: |
          set -uo pipefail
          # Overridable so the test harness can run hermetically; unchanged in
          # Actions, where nothing sets it.
          RESULT="${OCR_RESULT_FILE:-/tmp/ocr-result.json}"
          # Actions always sets this; the default exists so that if it ever is
          # not set, `set -u` does not abort the incomplete path halfway and
          # take the PR comment down with it. Found by enumerating the gate's
          # states rather than by a review.
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"

          # The two signals below are schema-independent facts: OCR saying
          # "partial" means partial whatever shape the rest of the document is
          # in. They are read FIRST, because an earlier version checked the
          # schema and the coverage shape before them — so a result reading
          # {"status":"partial", ..., "coverage":{}} hit the malformed-shape
          # warning and exited GREEN while literally declaring itself
          # incomplete. Verified before fixing.
          STATUS=""
          TERMINAL=""
          if [ -s "$RESULT" ] && jq -e . "$RESULT" >/dev/null 2>&1; then
            # @json-escaped: these are interpolated into ::error:: annotations
            # and into the PR comment, and a newline in either would split one
            # line into several. The forged-workflow-command half of that is
            # blocked by every line carrying its own prefix, but the format
            # damage and the misleading extra annotations are real.
            # Type-guarded and `|| true`. A valid-JSON result whose root or
            # .manifest is a scalar or array makes a bare .status/.manifest
            # lookup error, and Actions runs this step with -e, so the command
            # substitution aborted the whole job — turning the deliberately
            # non-blocking "we cannot tell" into a red check everywhere. rc=5,
            # verified.
            STATUS=$(jq -r 'if type == "object" then (.status? // "") else "" end
                            | if type == "string" then . else "" end
                            | @json | .[1:-1]' "$RESULT" 2>/dev/null || true)
            TERMINAL=$(jq -r 'if (type == "object") and ((.manifest? | type) == "object")
                              then (.manifest.terminal_state? // "") else "" end
                              | if type == "string" then . else "" end
                              | @json | .[1:-1]' "$RESULT" 2>/dev/null || true)
          fi
          DECLARED_PARTIAL=no
          [ "$STATUS" = "partial" ] && DECLARED_PARTIAL=yes
          [ "$TERMINAL" = "partial" ] && DECLARED_PARTIAL=yes

          # Every "we cannot tell" path goes through here. Unknown is not the
          # same as verified, so it is reported loudly — but it does not fail
          # the job, because a shape change upstream would otherwise redden
          # every PR in every consuming repo at once and the first fix anyone
          # reached for would be deleting this step. UNLESS the run already
          # said it was partial, in which case there is nothing to be unsure
          # about.
          # The sticky comment is written only on the incomplete path, so a later
          # run that PASSES used to exit without touching it — leaving the PR
          # showing "did not finish" over a review that had since covered
          # everything. Both success paths clear it now. Lookup failures are
          # non-fatal: reporting must never be able to fail a valid review.
          GATE_MARKER='<!-- ocr-completeness-gate -->'

          # Every matching id, newest last — not just the newest. Duplicates are
          # reachable whenever a lookup fails transiently: that run sees none,
          # posts a second, and a later success used to patch only one, leaving
          # the other permanently claiming the PR was not reviewed.
          find_gate_comment() {
            [ -n "${PR_NUMBER:-}" ] || return 0
            # --slurp, because --paginate runs --jq once PER PAGE: with a marker
            # on two pages the substitution returned "101\n202" and the PATCH
            # went to an endpoint containing both, failing with only a warning
            # and leaving the stale notice up. Slurping gives one array across
            # all pages, so `last` means the newest overall. Verified.
            # Bot-authored only. Anyone can post a comment containing the
            # marker; the PATCH would then target a comment this token did not
            # write, fail, and — because a non-empty PREV skips the
            # `gh pr comment` fallback — an incomplete review would get no PR
            # notice at all.
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --slurp \
              --jq "(add // [])
                    | map(select((.user.type == \"Bot\")
                                 and (.body | contains(\"$GATE_MARKER\"))))
                    | .[].id" \
              2>/dev/null || true
          }

          # Post or update, in one place. Three paths need it — incomplete,
          # abstained and cleared — and an earlier version had the logic only on
          # the incomplete path, so an abstention left whatever the previous run
          # had said standing on the PR.
          upsert_gate_comment() {  # body already written to OCR_COMMENT_FILE
            [ -n "${PR_NUMBER:-}" ] || return 0
            local ids found
            ids=$(find_gate_comment)
            found=0
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              found=1
              gh api "repos/${REPO}/issues/comments/${id}" --method PATCH \
                --field body=@"${OCR_COMMENT_FILE:-/tmp/ocr-incomplete.md}" >/dev/null 2>&1 \
                || echo "::warning::could not update gate comment ${id} on PR #${PR_NUMBER}"
            done <<< "$ids"
            [ "$found" = "1" ] && return 0
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body-file "${OCR_COMMENT_FILE:-/tmp/ocr-incomplete.md}" >/dev/null 2>&1 \
              || echo "::warning::could not post the gate comment to PR #${PR_NUMBER}"
          }

          clear_gate_comment() {  # $1 = one-line reason this run was fine
            [ -n "$(find_gate_comment)" ] || return 0
            {
              echo "$GATE_MARKER"
              echo "## ✅ OpenCodeReview completeness"
              echo
              echo "A later run $1, so the incomplete-review notice above no longer"
              echo "describes this pull request."
              echo
              echo "<sub>[Run log](${RUN_URL})</sub>"
            } > "${OCR_COMMENT_FILE:-/tmp/ocr-incomplete.md}"
            upsert_gate_comment
          }

          abstain() {
            if [ "$DECLARED_PARTIAL" = "yes" ]; then
              echo "::error::OCR declared itself partial (status: ${STATUS:-?}, terminal_state: ${TERMINAL:-?}) and $1. A partial review is not an approval." >&2
              {
                echo "## ❌ OpenCodeReview did not finish"
                echo
                echo "The run reported itself **partial** (status: \`${STATUS:-?}\`, terminal_state: \`${TERMINAL:-?}\`)"
                echo "and $1, so which files went unreviewed could not be determined."
              } >> "$GITHUB_STEP_SUMMARY"
              {
                echo "$GATE_MARKER"
                echo "## ❌ OpenCodeReview did not finish"
                echo
                echo "The run reported itself **partial** and $1, so **which** files went"
                echo "unreviewed could not be determined. No finding count from this run"
                echo "describes this pull request."
                echo
                echo "<sub>[Run log](${RUN_URL})</sub>"
              } > "${OCR_COMMENT_FILE:-/tmp/ocr-incomplete.md}"
              upsert_gate_comment
              exit 1
            fi
            echo "::warning::OCR completeness could not be verified: $1. Treat this check as 'unknown', not 'passed'."
            echo "⚠️ OCR completeness could not be verified ($1)." >> "$GITHUB_STEP_SUMMARY"
            # Still green by design — see the header — but a green required
            # check meaning "we did not verify" is the very thing this file
            # exists to stop being invisible. Say it where a reader sees it
            # without opening the run log.
            {
              echo "$GATE_MARKER"
              echo "## ⚠️ OpenCodeReview completeness unknown"
              echo
              echo "This check is **green but unverified**: $1."
              echo
              echo "The review itself may have been fine — this gate could not confirm it"
              echo "covered everything. Treat it as unknown rather than passed."
              echo
              echo "<sub>[Run log](${RUN_URL})</sub>"
            } > "${OCR_COMMENT_FILE:-/tmp/ocr-incomplete.md}"
            upsert_gate_comment
            exit 0
          }

          [ -s "$RESULT" ] || abstain "the result file is missing or empty"
          jq -e . "$RESULT" >/dev/null 2>&1 || abstain "the result is not valid JSON"

          SCHEMA=$(jq -r 'if (type == "object") and ((.manifest? | type) == "object")
                          then (.manifest.schema_version? // "absent") else "absent" end
                          | if type == "string" then . else "absent" end' "$RESULT" 2>/dev/null || echo absent)
          [ "$SCHEMA" = "ocr.run-manifest/v1" ] \
            || abstain "it declares schema_version ${SCHEMA} and this step understands ocr.run-manifest/v1 only"

          # ONE definition of an entry's identity, used by every comparison
          # below. Tagged with the field it came from: item_id and path are
          # different namespaces, so untagged strings let one entry's path
          # alias another's item_id and the two collapsed into one.
          #
          # `.item_id // .path` was wrong twice over: jq's // falls back only on
          # null/false, so an empty item_id BEAT a usable path, and a type check
          # passed it because "" is a string.
          ID='(if (.item_id? | type == "string" and length > 0) then "item_id:" + .item_id
               elif (.path? | type == "string" and length > 0) then "path:" + .path
               else null end)'

          jq -e '.manifest.coverage
                 | (.selected | type == "array")
                   and (.completed | type == "array")
                   and (.failed | type == "array")
                   and ([.selected[], .completed[], (.reused // [])[],
                         (.waived // [])[], .failed[]]
                        | all(type == "object" and ('"$ID"' != null)))' \
             "$RESULT" >/dev/null 2>&1 \
            || abstain "its coverage arrays are missing or hold entries without a usable item_id/path"

          # THE WHOLE COMPARISON HAPPENS INSIDE jq. It used to run through
          # `sort`/`comm` on newline-delimited files, and git permits a newline
          # in a filename — so one path could split into two lines and merge
          # with other identities. jq compares the values themselves, so what a
          # path contains stops being a question. The counts come back as two
          # integers and the report as one line per entry, with the path
          # @json-escaped so an exotic name cannot break the formatting either.
          COUNTS=$(jq -r '
            .manifest.coverage as $c
            | ([$c.selected[] | '"$ID"'] | unique) as $sel
            | ([($c.completed + ($c.reused // []) + ($c.waived // []))[] | '"$ID"'] | unique) as $cov
            | [($sel | length), ($sel - ($sel - $cov) | length)]
            | @tsv' "$RESULT") || abstain "its coverage entries could not be read"
          N_SELECTED=$(printf '%s' "$COUNTS" | cut -f1)
          N_COVERED=$(printf '%s' "$COUNTS" | cut -f2)

          INCOMPLETE="$DECLARED_PARTIAL"
          [ "$(jq '.manifest.coverage.failed | length' "$RESULT")" -gt 0 ] && INCOMPLETE=yes
          [ "${N_COVERED:-0}" -ne "${N_SELECTED:-0}" ] && INCOMPLETE=yes

          # Only once the signals are clean: nothing selected means there was
          # genuinely nothing to review — a Markdown-only diff, say. That is a
          # true "nothing to approve", not silence.
          if [ "$INCOMPLETE" = "no" ] && [ "${N_SELECTED:-0}" -eq 0 ]; then
            echo "OCR selected no files for review (status: ${STATUS:-?}); there is nothing for this gate to withhold."
            echo "ℹ️ OCR selected no files for review — nothing to approve or withhold." >> "$GITHUB_STEP_SUMMARY"
            clear_gate_comment "selected no files to review"
            exit 0
          fi

          if [ "$INCOMPLETE" = "no" ]; then
            echo "OCR reviewed every item it selected (${N_COVERED} of ${N_SELECTED})."
            clear_gate_comment "reviewed every item it selected (${N_COVERED} of ${N_SELECTED})"
            exit 0
          fi

          # Failed entries carry a reason; an unaccounted one exists in no
          # bucket at all and has none to give.
          UNREVIEWED=$(jq -r '
            .manifest.coverage as $c
            | ([($c.completed + ($c.reused // []) + ($c.waived // []))[] | '"$ID"'] | unique) as $cov
            | ([$c.failed[] | '"$ID"'] | unique) as $failed
            | ( [ $c.failed[]
                  | "- \((if (.path? | type == "string" and length > 0) then .path elif (.item_id? | type == "string" and length > 0) then "item " + .item_id else "?" end) | @json | .[1:-1] | ([scan("`+")] | map(length) | max // 0) as $n | ((("`" * ($n + 1)) // "`")) as $f | $f + (if test("^[`\\s]") or test("[`\\s]$") then " " + . + " " else . end) + $f) — \(.classification // "unknown" | @json | .[1:-1])"
                    + (if .reason then ": " + (.reason | @json | .[1:-1]) else "" end) ]
              + [ $c.selected[]
                  | select(('"$ID"' | IN($cov[]) | not) and ('"$ID"' | IN($failed[]) | not))
                  | "- \((if (.path? | type == "string" and length > 0) then .path elif (.item_id? | type == "string" and length > 0) then "item " + .item_id else "?" end) | @json | .[1:-1] | ([scan("`+")] | map(length) | max // 0) as $n | ((("`" * ($n + 1)) // "`")) as $f | $f + (if test("^[`\\s]") or test("[`\\s]$") then " " + . + " " else . end) + $f) — not reported in any coverage bucket" ] )
            | .[]' "$RESULT" || true)
          [ -n "$UNREVIEWED" ] || UNREVIEWED="- (the run reported itself incomplete without naming which items were missed)"

          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::OCR did not review ${line#- }"
          done <<< "$UNREVIEWED"

          {
            echo "## ❌ OpenCodeReview did not finish"
            echo
            echo "Covered **${N_COVERED} of ${N_SELECTED}** selected files (status: ${STATUS:-?}, terminal_state: ${TERMINAL:-?})."
            echo "The files below were never read, so no finding count from this run applies to them."
            echo
            echo "$UNREVIEWED"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${PR_NUMBER:-}" ]; then
            {
              echo "<!-- ocr-completeness-gate -->"
              echo "## ❌ OpenCodeReview did not finish"
              echo
              echo "This review covered **${N_COVERED} of ${N_SELECTED}** selected files. The following were"
              echo "selected and never reviewed, so **no finding count from this run applies to them**:"
              echo
              echo "$UNREVIEWED"
              echo
              echo "A review that did not run is not an approval. \`timeout\` means the file"
              echo "hit a time limit and will keep doing so — re-running alone will not help."
              echo "This run allowed ${TASK_TIMEOUT_MIN:-?} min per file per review round and"
              echo "${LLM_TIMEOUT_SEC:-?}s per request."
              # Recommend only a raise that would take effect this way.
              if [ "${TASK_SHORTENED:-}" != "true" ]; then
                echo "Those are the caller stub's settings, so either can be the one that fired:"
                echo "raise \`review_task_timeout_min\` (at most 25) and/or \`llm_timeout_sec\` (at most"
                echo "60 × the deadline; higher is clamped), or split the file."
              elif [ "${LLM_SHORTENED:-}" != "true" ] \
                   && (( ${LLM_TIMEOUT_SEC:-0} < ${TASK_TIMEOUT_MIN:-0} * 60 )); then
                echo "The per-file limit was shortened to fit this PR's size (configured:"
                echo "${CONFIGURED_TASK_MIN:-?} min), so raising \`review_task_timeout_min\` will not help."
                echo "\`llm_timeout_sec\` was not shortened: raising it, up to $(( ${TASK_TIMEOUT_MIN:-0} * 60 ))s, may."
                echo "Otherwise split the PR, or the slow files."
              else
                echo "The limits were shortened to fit this PR's size (configured: ${CONFIGURED_TASK_MIN:-?} min)"
                echo "and the request limit already fills the deadline, so raising the settings will"
                echo "not help. Split the PR, or the slow files."
              fi
              echo "\`budget\` means the file used up OCR's tool-call rounds per file (a limit"
              echo "the action does not expose); a re-run often finishes, and a smaller file helps."
              echo "For any other classification, re-run by commenting \`/open-code-review\`."
              echo
              echo "<sub>[Run log](${RUN_URL})</sub>"
            } > "${OCR_COMMENT_FILE:-/tmp/ocr-incomplete.md}"
            # Update in place. The comment tells the reader to re-run, so without
            # a marker every retry stacked another "did not finish" comment on
            # the PR — the same sticky pattern the OCR action uses for its own
            # summary.
            upsert_gate_comment
          fi

          echo "::error::OCR covered ${N_COVERED} of ${N_SELECTED} selected files (status: ${STATUS:-?}, terminal_state: ${TERMINAL:-?}). A partial review is not an approval — see the job summary for the files it skipped."
          exit 1

      - name: Report a limits error on the PR
        # A limits failure skips every attempt and the completeness gate, so
        # without this the PR would show a red check and nothing else. On a
        # later successful limits check it clears that notice, the way the
        # completeness gate clears its own, so a fixed stub does not leave a
        # comment claiming no review ran.
        if: ${{ !cancelled() && (steps.limits.outcome == 'failure' || steps.limits.outcome == 'success') }}
        timeout-minutes: 2   # bounded, so the job's 30-minute reserve holds
        uses: actions/github-script@v9
        env:
          # BEA-327: never interpolate a context value into a script body.
          LIMITS_ERROR: ${{ steps.limits.outputs.error }}
          LIMITS_OUTCOME: ${{ steps.limits.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            if (!prNumber) return;
            const marker = "<!-- ocr-limits-error -->";
            // Plain text only: backticks and angle brackets cannot become markup.
            const reason = (process.env.LIMITS_ERROR || "the limits step failed without a reason")
              .replace(/[`<>]/g, "'");
            const failed = process.env.LIMITS_OUTCOME === "failure";
            const body = failed
              ? `${marker}\n## ❌ OpenCodeReview did not run\n\nThe review time limits could not be set, so no review attempt ran:\n\n> ${reason}\n\nFix the caller stub (or the PR) and push, or re-run with \`/open-code-review\`.\n\n<sub>[Run log](${process.env.RUN_URL})</sub>`
              : `${marker}\n## ✅ OpenCodeReview time limits\n\nA later run set its time limits, so the "did not run" notice above no longer applies.\n\n<sub>[Run log](${process.env.RUN_URL})</sub>`;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const mine = comments.filter((c) => c.user && c.user.type === "Bot" && c.body && c.body.includes(marker));
              // Update every one: a transient lookup failure can leave two.
              for (const c of mine) {
                if (c.body !== body) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: c.id, body });
                }
              }
              // Post only on failure; success with no earlier notice says nothing.
              if (!mine.length && failed) {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            } catch (err) {
              core.warning(`Could not post the limits error to PR #${prNumber}: ${err.message}`);
            }

      - name: Fail if all review attempts failed
        timeout-minutes: 2   # bounded, so the job's 30-minute reserve holds
        # The attempt steps are continue-on-error, so this step is the only
        # thing that turns the job red. A skipped fallback (not configured)
        # has outcome 'skipped', which correctly does not count as success.
        if: >-
          steps.ocr-primary.outcome != 'success'
          && steps.ocr-fallback1.outcome != 'success'
          && steps.ocr-fallback2.outcome != 'success'
        env:
          PRIMARY_OUTCOME: ${{ steps.ocr-primary.outcome }}
          FALLBACK1_OUTCOME: ${{ steps.ocr-fallback1.outcome }}
          FALLBACK2_OUTCOME: ${{ steps.ocr-fallback2.outcome }}
        shell: bash
        run: |
          # Deliberately does NOT claim the LLM backends failed. A step's
          # `outcome` is failure if ANYTHING in that composite action failed —
          # the LLM call, dependency install, checkout, comment posting — so
          # naming the LLM here sends whoever debugs it to the wrong system.
          # It did exactly that during the BEA-473 artifact-409 incident, where
          # three LLM calls succeeded and this message still read "all backends
          # failed". State what is known and point at where the cause is.
          echo "::error::No OCR review attempt succeeded (primary: ${PRIMARY_OUTCOME}, fallback1: ${FALLBACK1_OUTCOME}, fallback2: ${FALLBACK2_OUTCOME}). This reports the *step* outcomes, which cover every stage of the review action, not the LLM call alone — open the failing attempt's log and read its last error before assuming a backend outage."
          exit 1

      - name: Request a Copilot review as a backup (advisory only)
        timeout-minutes: 5   # bounded, so the job's 30-minute reserve holds
        # Runs when no attempt produced a COMPLETE review: every attempt
        # failed, or the one that succeeded covered only some files. Ported
        # from the per-repo workaround in beauzone/mac-mcp-server
        # (ocr-fallback-copilot-review.yml) so every consuming repo gets it.
        #
        # BACKUP ONLY. The steps above have already failed this job, and
        # nothing here changes that: the check stays red, so every consuming
        # repo's merge policy ("a review that never ran is not approval")
        # still holds the PR for a human. Copilot's comments are supplementary
        # signal for that human, not a substitute gate. Its comments carry no
        # P1/P2 severity, which those policies key on.
        #
        # Every API failure here is a warning, never a job failure: this step
        # must not mask or replace the real reason the job is red.
        if: >-
          !cancelled()
          && steps.limits.outcome == 'success'
          && inputs.copilot_fallback != 'false'
          && (
            steps.completeness.outcome == 'failure'
            || (
              steps.ocr-primary.outcome != 'success'
              && steps.ocr-fallback1.outcome != 'success'
              && steps.ocr-fallback2.outcome != 'success'
            )
          )
        uses: actions/github-script@v9
        env:
          # BEA-327: never interpolate a context value into a script body.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PARTIAL: ${{ steps.completeness.outcome == 'failure' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            if (!prNumber) {
              core.info("No PR number in this event; nothing to do.");
              return;
            }
            const reason = process.env.PARTIAL === "true"
              ? "OpenCodeReview finished only part of the files it selected"
              : "no OpenCodeReview attempt succeeded";
            const copilotLogin = "copilot-pull-request-reviewer[bot]";
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber,
              });
              const { data: requested } = await github.rest.pulls.listRequestedReviewers({
                owner, repo, pull_number: prNumber,
              });
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: prNumber, per_page: 100,
              });
              // Skip only when Copilot is already pending, or has reviewed THIS
              // head commit. A Copilot review of an earlier commit says nothing
              // about the commit OCR just failed on (Codex pre-PR review).
              if (
                requested.users.some((u) => u.login === copilotLogin) ||
                reviews.some(
                  (r) => r.user && r.user.login === copilotLogin && r.commit_id === pr.head.sha
                )
              ) {
                core.info("Copilot is already reviewing (or has reviewed) this commit; not re-requesting.");
                return;
              }
              try {
                await github.rest.pulls.requestReviewers({
                  owner, repo, pull_number: prNumber, reviewers: [copilotLogin],
                });
              } catch (err) {
                core.warning(`Could not request Copilot as a reviewer: ${err.message}`);
              }
              const { data: after } = await github.rest.pulls.listRequestedReviewers({
                owner, repo, pull_number: prNumber,
              });
              const attached = after.users.some((u) => u.login === copilotLogin);

              const marker = "<!-- ocr-copilot-backup -->";
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              if (!attached && comments.some((c) => c.body && c.body.includes(marker))) {
                core.info("Already posted a could-not-attach note on this PR; not repeating it.");
                return;
              }
              const body = attached
                ? `${marker}\n🤖 **Copilot backup review requested**: ${reason}. Copilot has been added as a reviewer so this PR still gets an automated pass.\n\n**This is a backup, not an approval.** The OpenCodeReview check stays red, and the PR needs a human decision (or a clean OCR re-run via \`/open-code-review\`) before it can merge.`
                : `${marker}\n⚠️ **Copilot backup wanted, but could not attach**: ${reason}. Copilot was not added as a reviewer — Copilot code review is probably not enabled for this repository (Settings → Copilot → Code review), or set \`copilot_fallback: 'false'\` in the caller stub to stop trying. Re-run OCR with \`/open-code-review\`.`;
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            } catch (err) {
              core.warning(`Copilot backup step could not complete: ${err.message}`);
            }
