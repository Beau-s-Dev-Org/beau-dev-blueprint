# Runs this repo's own tests.
#
# The blueprint had no test CI: its only workflow reviewed its pull requests
# with OCR. That was tolerable while it shipped templates and docs, and stopped
# being tolerable once .github/workflows/ocr-review.yml grew logic that decides
# whether a review counts as approval in every consuming repo. A guard verified
# once by hand is the shape of dormant guard the guard itself exists to catch.
#
# Deliberately path-filtered: this repo is mostly templates and prose, and a
# gate that runs on every README edit is a gate people learn to ignore.
name: Tests

on:
  pull_request:
    paths:
      - '.github/workflows/ocr-review.yml'
      - '.github/workflows/test.yml'
      - 'scripts/**'
      - '.local-review-hold-paths'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ocr-review.yml'
      - '.github/workflows/test.yml'
      - 'scripts/**'
      - '.local-review-hold-paths'
  workflow_dispatch:

# One run per ref; a superseded push has nothing left to prove.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Require jq
        run: |
          command -v jq >/dev/null || {
            echo "::error::jq is not on PATH; the step under test parses JSON with it."
            exit 1
          }
          jq --version

      # Both of this suite's dependencies, declared rather than assumed. The
      # script parses the workflow with PyYAML to extract the step it tests, and
      # the extracted step parses the result JSON with jq — ubuntu-latest ships
      # both today, so the suite passed on what the runner image happens to
      # carry. A gate that breaks when that image changes, for a reason nothing
      # in this repo touched, is the dormant failure this workflow exists to
      # catch.
      #
      # PyYAML is pinned exactly: an open 6.x range resolves whatever exists at
      # run time, so a bad release breaks CI with no change here.
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: OCR completeness gate
        run: bash scripts/test-ocr-completeness.sh

      # Cross-family routing and the "clean" verdict for local review (BEA-591).
      # Uses only PyYAML, already installed above.
      # On Python 3.11, `unittest discover` exits 0 when it finds no tests,
      # so a renamed test module would turn this into a gate that runs
      # nothing. Fail unless at least one test ran. pipefail keeps a real test
      # failure from being masked by tee.
      - name: Local review routing
        run: |
          set -o pipefail
          # Checked explicitly rather than left to the runner's `bash -e`, so
          # a test failure fails this step wherever the snippet runs.
          if ! python3 -m unittest discover -s scripts/local-review -v 2>&1 \
               | tee "$RUNNER_TEMP/local-review-tests.log"; then
            echo "::error::unittest discover reported failures in scripts/local-review."
            exit 1
          fi
          grep -Eq '^Ran [1-9][0-9]* test' "$RUNNER_TEMP/local-review-tests.log" || {
            echo "::error::unittest discover ran no tests in scripts/local-review; the suite did not load."
            exit 1
          }
          # Per module too: a renamed module leaves the others still printing
          # "Ran N tests", and the gate green on a partial suite.
          missing=
          # Derived from the files, so a module added later is covered too.
          for path in scripts/local-review/test*.py; do   # discover's own pattern
            module=$(basename "$path" .py)
            # A helper that matches test*.py but defines no tests prints
            # nothing, and must not turn the gate red.
            grep -q 'def test' "$path" || continue
            grep -qF "($module." "$RUNNER_TEMP/local-review-tests.log" || missing="$missing $module"
          done
          [ -z "$missing" ] || {
            echo "::error::unittest discover did not run$missing; the gate would pass on a partial suite."
            exit 1
          }

      # The audit is a report, not a pass/fail gate — but it exits non-zero when
      # it cannot reach the step at all, which is how it broke the first time.
      # !cancelled(): a failing gate above must not skip the report, since those are
      # the runs where it is most wanted. Not on cancellation.
      - name: OCR completeness state audit
        if: ${{ !cancelled() }}
        run: python3 scripts/audit-ocr-completeness-states.py
