name: Conductor - Decompose Proposal
on:
  push:
    paths: ['proposals/**.md']

jobs:
  decompose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Get full history so git diff works

      - name: Get changed file
        id: files
        run: |
          # This finds the last changed file in proposals/
          FILE=$(git diff --name-only HEAD^ HEAD | grep 'proposals/' | head -n 1)
          echo "filename=$FILE" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install PyYAML requests

      - name: Verify shared parsing self-check
        # A self-check nothing runs is the same false assurance this pipeline
        # exists to remove. It caught nothing when extract_json_value was
        # renamed out from under it and the block sat broken for three commits.
        # Two seconds here, and a broken parser contract fails before any model
        # is called.
        run: python .agents/scripts/_shared.py

      - name: Run Decomposition Script
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          # ── LLM provider chain ──────────────────────────────────────
          # Same contract as reviewer-agent.yml: a router as primary so no
          # pinned model can be retired out from under this job (BEA-428), with
          # an independent fallback account for the failures a router does not
          # solve (chiefly an exhausted credit balance, a 402). All of it is
          # settings — changing a model or endpoint needs no source edit.
          LLM_URL: "https://openrouter.ai/api/v1"
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DECOMP_MODEL: "openrouter/auto"
          LLM_URL_FALLBACK1: "https://ollama.com/v1"
          LLM_API_KEY_FALLBACK1: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          DECOMP_MODEL_FALLBACK1: "glm-5.2:cloud"
          # The proposal filename reaches the script as an argument via env,
          # never interpolated into the shell body: a ${{ }} value is
          # substituted textually before bash parses the line, so a filename
          # containing a quote or $(...) would execute as code on the runner
          # (the BEA-327 class, fixed the same way there).
          PROPOSAL_FILE: ${{ steps.files.outputs.filename }}
        run: |
         # If no file was found, don't crash, just exit quietly
         if [ -z "$PROPOSAL_FILE" ]; then
         echo "No proposal file detected in this push."
         exit 0
         fi
         # Run the decomposition script once
         python .agents/scripts/decompose.py "$PROPOSAL_FILE"

      - name: Commit processed proposal
        env:
          # Same reason as the step above: a filename is attacker-influenceable
          # and ${{ }} is substituted before bash parses the line, so this value
          # must reach the shell as an environment variable, never spliced into
          # the command text (BEA-327 class).
          PROPOSAL_FILE: ${{ steps.files.outputs.filename }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed-proposals/ proposals/
          git diff --staged --quiet || git commit -m "chore: move $PROPOSAL_FILE to processed-proposals"
          git push